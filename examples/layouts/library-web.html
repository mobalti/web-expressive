      @layer layout {

          color-scheme: light dark;

          --placeholder-image: url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.5927 22.1228C53.754 20.7919 52.9004 19.4426 51.7664 18.3859C50.6325 17.3265 49.1635 16.578 47.6574 16.6755C46.3348 16.7625 45.1091 17.4951 44.1414 18.4517C43.1737 19.4084 42.4218 20.5864 41.6824 21.7538C39.6824 24.9057 37.68 28.0575 35.6801 31.212C34.7297 32.7089 33.7546 34.2716 33.4916 36.0557C33.174 38.2114 34.03 40.4067 35.5486 41.8403C37.1366 43.3398 39.7097 43.2186 41.6427 42.8075C43.7617 42.3568 45.8336 41.5082 47.9948 41.5109C49.8459 41.5109 51.6349 42.1381 53.4364 42.594C55.2353 43.0473 57.1683 43.3266 58.9052 42.652C61.0614 41.8166 62.6098 39.4421 62.5676 37.0045C62.5279 34.7802 60.1558 30.9432 60.1558 30.9432C60.1558 30.9432 56.4467 25.0631 54.5927 22.1228Z' fill='%238D8D8D'/%3E%3Cpath d='M52.0054 70.6317C52.2398 72.8701 52.357 73.9893 52.7875 74.8724C53.4103 76.1504 54.4973 77.1371 55.8224 77.6278C56.7382 77.9668 57.8538 77.9668 60.0849 77.9668H71.3508C74.049 77.9668 75.3981 77.9668 76.428 77.5247C77.9192 76.8847 79.0539 75.6127 79.5281 74.0494C79.8556 72.9697 79.7139 71.6162 79.4303 68.9092L78.2857 57.9807C78.0513 55.7423 77.9341 54.6231 77.5036 53.7399C76.8807 52.462 75.7938 51.4752 74.4687 50.9846C73.5529 50.6456 72.4373 50.6456 70.2062 50.6456H58.9403C56.2421 50.6456 54.893 50.6456 53.8631 51.0876C52.3719 51.7276 51.2372 52.9997 50.763 54.563C50.4355 55.6427 50.5772 56.9962 50.8608 59.7032L52.0054 70.6317Z' fill='%238D8D8D'/%3E%3Cpath d='M29.496 50.0216C30.1185 49.0319 31.5788 49.0319 32.2013 50.0216L33.6935 52.394C34.1028 53.0447 34.9284 53.3092 35.6473 53.02L38.2686 51.9656C39.3622 51.5257 40.5436 52.3722 40.4573 53.5337L40.2504 56.3179C40.1936 57.0816 40.7039 57.7742 41.4579 57.9569L44.2071 58.6233C45.354 58.9012 45.8052 60.2708 45.043 61.1605L43.2161 63.293C42.715 63.8779 42.715 64.734 43.2161 65.3189L45.043 67.4515C45.8052 68.3412 45.354 69.7107 44.2071 69.9887L41.4579 70.655C40.7039 70.8378 40.1936 71.5304 40.2504 72.294L40.4573 75.0782C40.5436 76.2398 39.3622 77.0862 38.2686 76.6463L35.6473 75.5919C34.9284 75.3027 34.1028 75.5673 33.6935 76.218L32.2013 78.5904C31.5788 79.5801 30.1185 79.5801 29.496 78.5904L28.0038 76.218C27.5946 75.5673 26.7689 75.3027 26.05 75.5919L23.4287 76.6463C22.3352 77.0862 21.1538 76.2398 21.2401 75.0782L21.447 72.294C21.5037 71.5304 20.9934 70.8378 20.2394 70.655L17.4903 69.9887C16.3434 69.7107 15.8921 68.3412 16.6543 67.4515L18.4812 65.3189C18.9823 64.734 18.9823 63.8779 18.4812 63.293L16.6543 61.1605C15.8921 60.2708 16.3434 58.9012 17.4903 58.6233L20.2394 57.9569C20.9934 57.7742 21.5037 57.0816 21.447 56.3179L21.2401 53.5337C21.1538 52.3722 22.3352 51.5257 23.4287 51.9656L26.05 53.02C26.7689 53.3092 27.5946 53.0447 28.0038 52.394L29.496 50.0216Z' fill='%238D8D8D'/%3E%3C/svg%3E%0A");
          --_section-padding-inline: var(--sys-measurement-space-200);

          /* Use scheme colors for browser find-in-page matches.
             Reference: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/::search-text */
          ::search-text {
            background: var(--sys-color-secondary-container);
            color: var(--sys-color-on-secondary-container);
          }

          ::search-text:current {
            background: var(--sys-color-tertiary-container);
            color: var(--sys-color-on-tertiary-container);
          }

          /* window-expanded-wider */
          @media (width >=600px) {
            --_section-padding-inline: var(--sys-measurement-space-400);
          }
        }

        body {
          display: grid;

          /* window-medium-wider */
          @media (width >=600px) {
            grid-template-columns: min-content 1fr;
          }
        }

        /* Navigation */
        @scope (.navigation-rail) to (.nav-item) {
          :scope {
            /* Local additions between or beyond the shared spacing tokens. */
            --_extended-measurement-space-550: 2.75rem; /* 44px */

            z-index: 100;
            background: var(--sys-color-surface-container-low);

            @media (width >=600px) {
              display: grid;
              position: sticky;
              grid-template-rows: min-content 1fr;
              align-content: space-between;
              place-items: start center;
              gap: var(--sys-measurement-space-500);
              inset-block-start: 0;
              padding-block: var(--_extended-measurement-space-550)
                var(--sys-measurement-space-700);
              block-size: 100lvb;
              overflow-block: auto;
            }

            /* window-compact */
            @media (width < 600px) {
              position: fixed;
              inset-block-end: 0;
              inline-size: 100%;
              overflow-inline: auto;
            }

            /* window-expanded-wider */
            @media (width >=840px) {
              inline-size: 220px;
            }
          }

          .extended-fab {
            /* window-expanded-wider */
            @media (width >=840px) {
              place-self: start;
              margin-inline-start: var(--sys-measurement-space-250);
            }

            /* window-medium */
            @media (600px <=width < 840px) {
              gap: var(--sys-measurement-space-0);

              .label-text {
                opacity: 0;
                width: 0;
              }
            }

            /* A FAB nested in a navigation rail rests at elevation level 0.
               Reference: https://m3.material.io/components/navigation-rail/guidelines */

            /* window-medium-wider */
            &:not(:hover, :active, :focus-visible) {
              @media (width >=600px) {
                --_shadow: none;
              }
            }

            /* window-compact */
            @media (width < 600px) {
              position: fixed;
              inset-block-end: 5rem;
              inset-inline-end: var(--sys-measurement-space-200);

              @media (prefers-reduced-motion: no-preference) {
                @supports (container-type: scroll-state) and
                  (inline-size: calc-size(auto, size)) {
                  transition: inline-size
                    var(--sys-motion-spring-default-spatial-duration)
                    var(--sys-motion-spring-default-spatial);
                  /* calc-size() lets the label animate from its intrinsic width.
                     Reference: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Values/calc-size */
                  inline-size: calc-size(fit-content, size);

                  @starting-style {
                    inline-size: var(--_block-size);
                  }

                  .label-text {
                    opacity: 1;
                    transition: opacity
                      var(--sys-motion-spring-default-effects-duration)
                      var(--sys-motion-spring-default-effects);

                    @starting-style {
                      opacity: 0;
                    }
                  }

                  /* Progressive enhancement: collapse the Extended FAB to a FAB
                     while scrolling toward block-end, then expand it toward block-start.
                     .label-text is a local animation hook, not a component requirement.
                     Material guidance: https://m3.material.io/components/extended-fab/guidelines
                     CSS technique: https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Conditional_rules/Container_scroll-state_queries */

                  @container scroller scroll-state(scrolled: block-end) {
                    inline-size: var(--_block-size);

                    .label-text {
                      opacity: 0;
                    }
                  }
                }
              }
            }
          }

          .icon-button {
            /* window-expanded-wider */
            @media (width >=840px) {
              place-self: start;
              margin-inline-start: var(--sys-measurement-space-250);
            }

            /* window-medium-wider */
            @media (width < 600px) {
              display: none;
            }

            .icon {
              font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
            }
          }

          .segments {
            display: grid;
            padding: var(--sys-measurement-space-0);
            list-style: none;

            /* window-compact */
            @media (width < 600px) {
              grid-auto-flow: column;
            }

            /* window-medium */
            @media (600px <=width < 840px) {
              gap: var(--sys-measurement-space-100);
            }

            /* window-expanded-wider */
            @media (width >=840px) {
              inline-size: 100%;
            }
          }
        }

        @scope (.nav-item) {
          :scope {
            --_background: none;
            --_state: none;
            --_color: var(--sys-color-on-surface-variant);
            --_outline-width: 0px;
            --_icon-fill: 0;

            display: grid;
            outline: none;
            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
            user-select: none;
            white-space: nowrap;

            /* window-expanded-wider */
            @media (width >=840px) {
              place-items: start;
              padding-inline: var(--sys-measurement-space-250);
              inline-size: 100%;
            }

            /* window-medium */
            @media (600px <=width < 840px) {
              inline-size: 96px;
              block-size: 64px;
            }

            /* window-compact */
            @media (width < 600px) {
              min-inline-size: 20cqi;
            }

            &.selected {
              --_background: var(--sys-color-secondary-container);
              --_color: var(--sys-color-on-secondary-container);
              --_icon-fill: 1;
            }

            &:hover {
              --_state: oklch(from var(--_color) l c h / 8%);
            }

            &:focus-visible {
              --_state: oklch(from var(--_color) l c h / 10%);
              --_outline-width: 3px;
            }

            &:active {
              --_state: oklch(from var(--_color) l c h / 10%);
            }
          }

          .item-container {
            display: flex;
            grid-template-rows: min-content 1fr;
            place-items: center;
            gap: var(--sys-measurement-space-50);
            padding-block: var(--sys-measurement-space-75);

            /* window-expanded-wider */
            @media (width >=840px) {
              position: relative;
              gap: var(--sys-measurement-space-100);
              border-radius: var(--sys-shape-corner-full);
              background: var(--_background);
              isolation: isolate;
              padding: var(--sys-measurement-space-200);

              &::before {
                position: absolute;
                z-index: -1;
                inset: 0;
                outline: var(--_outline-width) solid var(--sys-color-secondary);
                border-radius: var(--sys-shape-corner-full);
                background: var(--_state);
                content: "";

                @media (prefers-reduced-motion: no-preference) {
                  transition: outline-width
                    var(--sys-motion-spring-fast-spatial-duration)
                    var(--sys-motion-spring-pop-focus);
                }
              }
            }

            /* window-medium-narrower */
            @media (width < 840px) {
              flex-direction: column;
              gap: var(--sys-measurement-space-50);
            }
          }

          .icon-container {
            display: grid;
            place-items: center;
            isolation: isolate;

            /* window-medium-narrower */
            @media (width < 840px) {
              &::before {
                grid-area: 1/1;
                z-index: -1;
                outline: var(--_outline-width) solid var(--sys-color-secondary);
                border-radius: var(--sys-shape-corner-large);
                background: var(--_background);
                inline-size: 56px;
                block-size: 32px;
                content: "";

                /* Respect the user's reduced-motion preference. */
                @media (prefers-reduced-motion: no-preference) {
                  transition: outline-width
                    var(--sys-motion-spring-fast-spatial-duration)
                    var(--sys-motion-spring-pop-focus);
                }
              }

              &::after {
                grid-area: 1/1;
                z-index: -1;
                border-radius: var(--sys-shape-corner-large);
                background: var(--_state);
                inline-size: 56px;
                block-size: 32px;
                content: "";
              }
            }
          }

          .icon {
            grid-area: 1/1;
            color: var(--_color);
            font-size: 1.5rem;
            line-height: 1;
            font-family: var(--ref-typeface-symbols);
            font-feature-settings: "liga";
            font-variation-settings:
              "FILL" var(--_icon-fill),
              "wght" 400,
              "GRAD" 0,
              "opsz" 24;
            white-space: nowrap;
            display: inline-block;
            inline-size: 1.5rem;
            block-size: 1.5rem;
            overflow: clip;
          }

          .label-text {
            color: var(--_color);
            font: var(--sys-typescale-label-medium);

            /* window-expanded-wider */
            @media (width >=840px) {
              font: var(--sys-typescale-label-large);
            }
          }
        }

        /* Main Content */

        @scope (.app-content) to (.app-bar) {
          /* Local additions between or beyond the shared spacing tokens. */
          --_extended-measurement-space-1000: 5rem; /* 80px */

          background: var(--sys-color-surface-container-lowest);
          padding-block-end: var(--_extended-measurement-space-1000);
        }

        @scope (.app-bar) {
          :scope {
            display: grid;
            position: sticky;
            z-index: 100;
            inset-block-start: 0;
            background: inherit;
            padding-block: var(--sys-measurement-space-200);
          }

          .leading-trailing-elements {
            display: grid;
            grid-auto-flow: column;
            justify-content: space-between;
            padding-inline: calc(
              var(--_section-padding-inline) - var(--sys-measurement-space-200)
            );
            inline-size: 100%;
          }

          .leading-elements {
            display: grid;
          }

          .trailing-elements {
            display: grid;
            grid-auto-flow: column;
          }

          .text-content {
            display: grid;
            gap: var(--sys-measurement-space-100);
            padding-inline: var(--_section-padding-inline);
          }

          .headline {
            font: var(--sys-typescale-emphasized-headline-medium);

            /* window-medium-wider */
            @media (width >=600px) {
              font: var(--sys-typescale-emphasized-display-small);
            }
          }

          .supporting-text {
            visibility: hidden;
            color: var(--sys-color-on-surface-variant);
            font: var(--sys-typescale-label-large);

            /* window-medium-wider */
            @media (width >=600px) {
              font: var(--sys-typescale-title-medium);
            }
          }

          .icon {
            font-variation-settings:
              "FILL" 0,
              "wght" 400,
              "GRAD" 0,
              "opsz" 24;
          }
        }
      }
    </style>

    <!-- Content -->
    <style>
      @layer layout {
        /* Filter Carousel */

        @scope (.home) to (.card-grid) {
          /*
            Progressive enhancement: supporting browsers generate carousel
            buttons. Without this feature, the horizontal scroller remains
            fully usable.
            https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Overflow/Carousels
          */
          @supports (scroll-marker-group: after) {
            .filter-carousel {
              --_button-size: 3rem;
              --_button-group-gap: var(--sys-measurement-space-100);
              --_icon-button-font-size: 1.75rem;
              --_state: transparent;

              anchor-name: --carousel;
              container-type: scroll-state;
              overscroll-behavior-inline: contain;
              scroll-behavior: smooth;
              scroll-snap-type: inline mandatory;
              anchor-scope: all;

              &::scroll-button(*) {
                --_outline-width: 0;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                --_background: var(--sys-color-surface-container-lowest);
                --_color: var(--sys-color-on-surface);

                display: inline grid;
                position: absolute;
                position-anchor: --carousel;
                place-items: center;
                transition:
                  outline-width var(--sys-motion-spring-fast-spatial-duration)
                    var(--sys-motion-spring-pop-focus),
                  border-radius var(--sys-motion-spring-fast-spatial-duration)
                    var(--sys-motion-spring-fast-spatial);
                cursor: pointer;
                inset-block-start: calc(anchor(start));
                outline: var(--_outline-width) solid var(--sys-color-secondary);
                outline-offset: 2px;
                box-shadow: var(--sys-elevation-level-3);
                border: none;
                border-radius: calc(var(--_button-size) / 2);

                background: linear-gradient(var(--_state)), var(--_background);
                inline-size: var(--_button-size);
                block-size: var(--_button-size);
                color: var(--sys-color-on-surface);
                font-size: var(--_icon-button-font-size);
                font-family: var(--ref-typeface-symbols);
                font-feature-settings: "liga";
                user-select: none;
                overflow: clip;

                @container not scroll-state(scrollable) {
                  visibility: hidden;
                }
              }

              &::scroll-button(*):disabled {
                visibility: hidden;
                cursor: not-allowed;
              }

              &::scroll-button(*):hover {
                --_state: oklch(from var(--_color) l c h / 8%);
              }

              &::scroll-button(*):focus-visible {
                --_outline-width: 3px;
                --_state: oklch(from var(--_color) l c h / 8%);
              }

              &::scroll-button(*):active {
                --_state: oklch(from var(--_color) l c h / 10%);
                border-radius: var(--sys-shape-corner-small);
              }

              &::scroll-button(inline-start) {
                inset-inline-start: calc(anchor(start) - 0.75rem);
                content: "chevron_backward" / "Scroll back";
              }

              &::scroll-button(inline-end) {
                inset-inline-end: calc(anchor(end) - 0.75rem);
                content: "chevron_forward" / "Scroll forward";
              }
            }

            .item {
              scroll-snap-align: start;
            }
          }

          :scope {
            container-type: inline-size;
          }

          .header {
            display: grid;
            padding-inline: var(--_section-padding-inline);
            inline-size: 100cqi;
          }

          .filter-carousel {
            display: grid;

            transition: scrollbar-color
              var(--sys-motion-spring-fast-effects-duration)
              var(--sys-motion-spring-fast-effects);
            inline-size: 100%;
            overflow-inline: auto;
            scrollbar-color: transparent transparent;
            scrollbar-width: none;

            &:hover {
              scrollbar-color: var(--sys-color-outline-variant) transparent;
            }
          }

          .fieldset {
            display: grid;
            border: none;
            padding: var(--sys-measurement-space-0);
          }

          .toggle-button:not(:has(.input:checked)) {
            .icon {
              display: none;
            }
          }
        }

        /* Card Grid */

        @scope (.card-grid) {
          :scope {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--sys-measurement-space-100);
            padding-inline: var(--_section-padding-inline);
            padding-block: var(--sys-measurement-space-200);
            list-style: none;

            /* window-medium-wider */
            @media (width >= 600px) {
              column-gap: var(--sys-measurement-space-300);
              row-gap: var(--sys-measurement-space-200);
            }

            /* window-large-wider */
            @media (width >=1200px) {
              grid-template-columns: repeat(4, 1fr);
            }

            /* window-extra-large */
            @media (width >=1600px) {
              grid-template-columns: repeat(6, 1fr);
            }
          }

          .link-wrapper {
            --_outline-width: 0px;

            outline: none;
            color: var(--sys-color-on-surface);
            text-decoration: none;

            &:focus-visible {
              --_outline-width: 3px;
            }
          }

          .avatar {
            display: grid;
            gap: var(--sys-measurement-space-100);
          }

          .visual {
            outline: var(--_outline-width) solid
              var(--sys-color-on-secondary-container);
            border-radius: var(--sys-shape-corner-large);
            background: var(--sys-color-surface-container-high);
            aspect-ratio: 1;
            overflow: clip;

            position: relative;
            isolation: isolate;

            &:not(:has(.img)) {
              &::before {
                position: absolute;
                content: "";
                inline-size: 100%;
                block-size: 100%;
                background: oklch(from var(--sys-color-on-surface) l c h / 16%);
                display: block;
                mask: var(--placeholder-image) center/contain no-repeat;
              }
            }
          }
