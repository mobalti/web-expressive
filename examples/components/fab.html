<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Expressive — FAB</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <meta name="description" content="An expressive floating action button built with standard HTML and CSS, with no framework or build step." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=design_services,stars,arrow_back,code,more_vert&display=block"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/web-expressive@1.0.0/dist/core.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/web-expressive@1.0.0/dist/schemes/alpha/classic-tonal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/web-expressive@1.0.0/dist/components/fab.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/web-expressive@1.0.0/dist/components/icon-button.css" />

    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }
      @layer layout {
        .wrapper {
          display: grid;
          place-items: start center;
          padding-block: var(--sys-measurement-space-400);
        }

        @scope (.main) to (.section) {
          :scope {
            display: grid;
          }

          .app-bar {
            position: sticky;
            z-index: 100;
            inset-block-start: var(--sys-measurement-space-0);
            background: var(--sys-color-surface-container);
            background: linear-gradient(
              in oklab,

              var(--sys-color-surface),
              transparent
            );

            background: var(--sys-color-surface);

            padding-block: var(--sys-measurement-space-100);
          }

          .container {
            display: grid;
            grid-template-columns: 1fr min-content;
            justify-content: space-between;
            place-items: center;
            /* window-medium-wider */
            @media (width >= 600px) {
              padding-inline: var(--sys-measurement-space-100);
            }
          }
          .leading-elements {
            display: grid;
            grid-template-columns: min-content 1fr;
            place-items: center start;
            inline-size: 100%;
            --size-items: medium;
            /* window-compact */
            @media (width < 600px) {
              --width-items: narrow;
            }

            /* window-medium-wider */
            @media (width >= 600px) {
              gap: var(--sys-measurement-space-100);
            }
          }

          .headline {
            display: block;
            inline-size: 100%;
            overflow: hidden;
            font: var(--sys-typescale-emphasized-title-large);
            text-overflow: ellipsis;
            white-space: nowrap;

            /* window-medium-wider */
            @media (width >= 600px) {
              font: var(--sys-typescale-emphasized-headline-small);
            }
          }
          .trailing-elements {
            display: grid;
            --size-items: medium;

            /* window-compact */
            @media (width < 600px) {
              --width-items: narrow;
            }
          }

          .options-menu-popover {
            position-anchor: --options-menu-popover-trigger;
            position-area: block-end;
            inset-inline-end: calc(anchor(end));
            border: none;

            @media (prefers-reduced-motion: no-preference) {
              /* MODERN IMPLEMENTATION: Height unfolding via calc-size() */
              @supports (block-size: calc-size(auto, size)) {
                opacity: 0;

                /* Keep display & overlay active for the full spatial spring duration (500ms) */
                transition:
                  opacity var(--sys-motion-spring-fast-effects-duration) var(--sys-motion-spring-fast-effects),
                  block-size var(--sys-motion-spring-default-spatial-duration) var(--sys-motion-spring-default-spatial),
                  overlay var(--sys-motion-spring-default-spatial-duration) allow-discrete,
                  display var(--sys-motion-spring-default-spatial-duration) allow-discrete;
                block-size: 0;
                overflow: clip; /* Prevents internal content overflow while height collapses */

                &:popover-open {
                  opacity: 1;
                  block-size: calc-size(auto, size);

                  @starting-style {
                    opacity: 0;
                    block-size: 0;
                  }
                }
              }

              /* FALLBACK IMPLEMENTATION: Scale-fade transform for Firefox & Safari */
              @supports not (block-size: calc-size(auto, size)) {
                transform-origin: right top;
                scale: 0.8;
                opacity: 0;

                /* Discrete transitions match the 150ms fast-effects duration used by scale & opacity */
                transition:
                  opacity var(--sys-motion-spring-fast-effects-duration) var(--sys-motion-spring-fast-effects),
                  scale var(--sys-motion-spring-fast-effects-duration) var(--sys-motion-spring-fast-effects),
                  overlay var(--sys-motion-spring-fast-effects-duration) allow-discrete,
                  display var(--sys-motion-spring-fast-effects-duration) allow-discrete;

                &:popover-open {
                  scale: 1;
                  opacity: 1;

                  @starting-style {
                    scale: 0.8;
                    opacity: 0;
                  }
                }
              }
            }

            @media (width < 600px) {
              inset-inline-end: calc(anchor(end) + var(--sys-measurement-space-100));
            }
          }

          .options-menu-popover-trigger {
            anchor-name: --options-menu-popover-trigger;
            .app-bar:has(.options-menu-popover:popover-open) & {
              --_border-radius: var(--_pressed-button-corner);
              --_state: oklch(from var(--_color) l c h / 10%);
            }
          }
        }
        @scope (.section) {
          :scope {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-inline: var(--sys-measurement-space-200);
            padding-block: 4rem;
            overflow-inline: auto;

            @media (width < 600px) {
              inline-size: 100%;
            }
          }

          .article {
            inline-size: max-content;
            user-select: none;
          }

          .headline {
            color: var(--sys-color-on-surface);
            font: var(--sys-typescale-headline-large);
            white-space: nowrap;
          }

          .title {
            font: var(--sys-typescale-title-medium);
          }
        }
      }

      @layer components {
        @scope (.menu) {
          :scope {
            --_background: var(--sys-color-surface-container-low);
            --_color: var(--sys-color-on-surface);
            --_outline-width: 0px;
            box-shadow: var(--sys-elevation-level-3);

            border-radius: var(--sys-shape-corner-large);
            background: var(--_background);
            padding: var(--sys-measurement-space-25);
            min-inline-size: 208px;
          }

          .list {
            padding: var(--sys-measurement-space-0);
            list-style: none;
          }

          .item-action {
            --_background: none;
            display: grid;
            cursor: pointer;
            outline: none;
            border: none;
            background: transparent;
            padding: var(--sys-measurement-space-25);
            inline-size: 100%;
            block-size: 3rem;
            color: var(--_color);
            user-select: none;
            text-decoration: none;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;

            &:hover {
              --_background: oklch(from var(--_color) l c h / 8%);
            }

            &:focus-visible {
              --_background: oklch(from var(--_color) l c h / 10%);
              --_outline-width: 3px;
            }

            &:active {
              --_background: oklch(from var(--_color) l c h / 10%);
            }
          }

          .item-layout {
            display: grid;
            position: relative;
            grid-template-columns: min-content 1fr auto min-content;
            grid-template-areas: "leading text badge trailing";
            align-items: center;
            outline: var(--_outline-width) solid var(--sys-color-secondary);
            outline-offset: 2px;
            border-radius: var(--sys-shape-corner-extra-small);
            background: none;
            isolation: isolate;
            padding-inline: var(--sys-measurement-space-150);
            inline-size: 100%;
            block-size: 100%;
            color: var(--_color);
            &::before {
              position: absolute;
              z-index: -1;
              inset: 0;
              border-radius: inherit;
              background: var(--_background);
              content: "";
            }

            .menu-item:first-child & {
              border-start-start-radius: var(--sys-shape-corner-medium);
              border-start-end-radius: var(--sys-shape-corner-medium);
            }
            .menu-item:last-child & {
              border-end-start-radius: var(--sys-shape-corner-medium);
              border-end-end-radius: var(--sys-shape-corner-medium);
            }
          }

          .icon {
            --_fill: 1;
            display: inline-block;
            inline-size: 1.25rem;
            block-size: 1.25rem;
            overflow: clip;
            font-size: 1.25rem;
            line-height: 1;
            font-family: var(--ref-typeface-symbols);
            font-variation-settings:
              "FILL" var(--_fill),
              "wght" 400,
              "GRAD" 0,
              "opsz" 24;
            font-feature-settings: "liga";
            white-space: nowrap;

            &.no-fill {
              --_fill: 0;
            }

            &:is(svg) {
              fill: var(--_color);
            }

            &:is(img) {
              object-fit: cover;
            }
          }

          .text-content {
            display: grid;
            grid-area: text;
            text-align: start;
          }

          .menu-item-text {
            overflow: hidden;
            font: var(--sys-typescale-label-large);
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .supporting-text {
            overflow: hidden;
            color: var(--sys-color-on-surface-variant);
            font: var(--sys-typescale-body-small);
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          /* | leading + 8px | text | +8px badge | +8px trailing | */

          .leading-icon {
            grid-area: leading;
            margin-inline-end: var(--sys-measurement-space-100);
          }
          .badge {
            grid-area: badge;
            margin-inline-start: var(--sys-measurement-space-100);
          }
          .trailing-icon {
            grid-area: trailing;
            margin-inline-start: var(--sys-measurement-space-100);
          }

          .badge {
            border-radius: var(--sys-shape-corner-full);
            background: var(--sys-color-primary-container);
            padding-inline: var(--sys-measurement-space-50);
            overflow: clip;
            color: var(--sys-color-on-primary-container);
            font: var(--sys-typescale-label-small);
          }

          .divider {
            display: grid;
            place-items: center;
            padding-inline: var(--sys-measurement-space-125);
            padding-block: var(--sys-measurement-space-25);
            &::before {
              background: var(--sys-color-outline-variant);
              inline-size: 100%;
              block-size: 1px;
              content: "";
            }
          }
        }
      }
    </style>
  </head>

  <body>
    <!--
        Web Expressive
        GitHub: https://github.com/mobalti/web-expressive
    -->
    <main class="main">
      <header class="app-bar">
        <div class="container">
          <div class="leading-elements">
            <a href="../../" class="icon-button standard" aria-label="Go back home">
              <span class="icon" aria-hidden="true">arrow_back</span>
            </a>
            <h1 class="headline">Web Expressive FAB</h1>
          </div>

          <div class="trailing-elements">
            <button
              class="icon-button standard options-menu-popover-trigger"
              popovertarget="options-menu-popover"
              aria-label="More options"
              title="More options"
            >
              <span class="icon" aria-hidden="true">more_vert</span>
            </button>

            <div class="menu options-menu-popover" popover id="options-menu-popover">
              <div class="content">
                <ul class="list">
                  <li class="menu-item">
                    <a href="../../docs/index.html#fab" class="item-action">
                      <div class="item-layout">
                        <div class="text-content">
                          <div class="menu-item-text">View developer docs</div>
                        </div>
                      </div>
                    </a>
                  </li>
                  <li class="menu-item">
                    <a href="https://github.com/mobalti/web-expressive/blob/main/lib/components/fab.css" class="item-action">
                      <div class="item-layout">
                        <div class="text-content">
                          <div class="menu-item-text">View source code</div>
                        </div>
                      </div>
                    </a>
                    <div aria-hidden="true" class="divider"></div>
                  </li>
                  <li class="menu-item">
                    <a href="https://github.com/mobalti/web-expressive/issues" class="item-action">
                      <div class="item-layout">
                        <div class="text-content">
                          <div class="menu-item-text">Report an issue</div>
                        </div>
                      </div>
                    </a>
                    <div aria-hidden="true" class="divider"></div>
                  </li>
                  <li class="menu-item">
                    <a href="https://m3.material.io/components/floating-action-button/overview" class="item-action">
                      <div class="item-layout">
                        <div class="text-content">
                          <div class="menu-item-text">View design guidelines</div>
                        </div>
                      </div>
                    </a>
                  </li>
                  <li class="menu-item">
                    <a href="https://github.com/mobalti/web-expressive/blob/main/LICENSE" class="item-action">
                      <div class="item-layout">
                        <div class="text-content">
                          <div class="menu-item-text">Open source licenses</div>
                        </div>
                      </div>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="wrapper">
        <section class="section">
          <article class="article">
            <h3 class="title">Primary Container</h3>
            <button class="fab primary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium primary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large primary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
          <article class="article">
            <h3 class="title">Secondary Container</h3>
            <button class="fab secondary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium secondary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large secondary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
          <article class="article">
            <h3 class="title">Tertiary Container</h3>
            <button class="fab tertiary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium tertiary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large tertiary-container" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
          <article class="article">
            <h3 class="title">Primary</h3>
            <button class="fab primary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium primary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large primary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
          <article class="article">
            <h3 class="title">Secondary</h3>
            <button class="fab secondary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium secondary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large secondary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
          <article class="article">
            <h3 class="title">Tertiary</h3>
            <button class="fab tertiary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab medium tertiary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
            <button class="fab large tertiary" aria-label="Label text">
              <span class="icon" aria-hidden="true">stars</span>
            </button>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
